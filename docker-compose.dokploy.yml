x-app-environment: &app-environment
  MIX_ENV: "${MIX_ENV-prod}"
  PHX_HOST: "${PHX_HOST-psc-elixir-a7c-143-47-45-134.sslip.io}"
  PORT: "${PORT-4000}"
  PHX_SERVER: "${PHX_SERVER-true}"
  SECRET_KEY_BASE: "${SECRET_KEY_BASE-T7vQ2mZ7pL4xN9cR5kD8sH3wF6jA1uB0eG2yC4nM6qP8rS5tV3xK9pL2zC7wR4mN6}"
  DATABASE_URL: "ecto://${POSTGRES_USER-psc}:${POSTGRES_PASSWORD-PscElixir-9vQ2mZ7pL4xN}@postgres:5432/${POSTGRES_DB-psc_elixir}"
  POOL_SIZE: "${POOL_SIZE-10}"
  # The database is the sibling container below: same host, no TLS. Setting it
  # explicitly keeps release setup/ecto from starting TLS (and loading the OS
  # CA store) for a connection that never negotiates it.
  PSC_DB_SSL: "${PSC_DB_SSL-false}"
  # Admins are created or promoted at boot by Psc.Release.setup/0. Set
  # ADMIN_EMAILS to the operator address (comma separated); ADMIN_PASSWORD is
  # only used the first time an address has no account yet.
  ADMIN_EMAILS: "${ADMIN_EMAILS-}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD-}"
  GIT_REPOSITORY: "${GIT_REPOSITORY-https://github.com/beltranaceves/psc-elixir}"
  GIT_REF: "${GIT_REF-default}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB-psc_elixir}"
      POSTGRES_USER: "${POSTGRES_USER-psc}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD-PscElixir-9vQ2mZ7pL4xN}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  bootstrap:
    image: elixir:1.20.4-otp-29-slim
    # A one-shot build: success exits 0 and keeps the release in the volume.
    # "on-failure" turned a broken build into an endless retry loop that only
    # repeated the same error; let the deploy fail visibly instead.
    restart: "no"
    working_dir: /workspace
    environment: *app-environment
    volumes:
      - psc_elixir_release:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail

        # The base image is not guaranteed to carry the build tools or a CA
        # bundle, and a fresh container has neither. This must not be tied to
        # the clone: once mix.exs exists in the volume the old script skipped
        # the install, and every later start failed in `mix local.hex` with
        # {:failed_load_cacerts, :no_cacerts_found}.
        packages=""
        command -v git >/dev/null 2>&1 || packages="$$packages git"
        command -v make >/dev/null 2>&1 || packages="$$packages build-essential"
        # The asset build needs curl: the tailwind and esbuild Hex packages
        # download their CLIs with Erlang's HTTP client, which cannot follow the
        # GitHub release redirect behind the proxy (it fails on headers over
        # 10 KB). The build fetches them explicitly below.
        command -v curl >/dev/null 2>&1 || packages="$$packages curl"
        [ -s /etc/ssl/certs/ca-certificates.crt ] || packages="$$packages ca-certificates openssl"

        if [ -n "$$packages" ]; then
          echo "Installing build packages:$$packages"
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $$packages
          update-ca-certificates
        fi

        if [ ! -s /etc/ssl/certs/ca-certificates.crt ]; then
          echo "No CA bundle at /etc/ssl/certs/ca-certificates.crt; HTTPS fetches would fail" >&2
          exit 1
        fi

        export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
        export SSL_CERT_DIR=/etc/ssl/certs

        # "default" means the repository's default branch.
        if [ "$${GIT_REF}" = "default" ]; then
          ref="HEAD"
        else
          ref="$${GIT_REF}"
        fi

        previous="$$(git -C /workspace rev-parse HEAD 2>/dev/null || true)"

        if [ -d /workspace/.git ]; then
          # The volume survives deploys, so the checkout has to be moved to the
          # requested revision on every run. Cloning only when mix.exs was
          # missing meant later commits were never deployed.
          git -C /workspace remote set-url origin "$${GIT_REPOSITORY}"
          git -C /workspace fetch --depth 1 origin "$$ref"
          git -C /workspace reset --hard FETCH_HEAD
        else
          find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          if [ "$$ref" = "HEAD" ]; then
            git clone --depth 1 "$${GIT_REPOSITORY}" /workspace
          else
            git clone --depth 1 --branch "$$ref" "$${GIT_REPOSITORY}" /workspace
          fi
        fi

        current="$$(git -C /workspace rev-parse HEAD)"
        echo "Building $${GIT_REPOSITORY} at $${current}"

        if [ -n "$$previous" ] && [ "$$previous" != "$$current" ]; then
          # Previous beams and the previous release belong to other sources.
          rm -rf /workspace/_build
        fi

        # The tailwind and esbuild Hex packages download their CLIs themselves,
        # using Erlang's HTTP client, which rejects response headers over 10 KB.
        # The GitHub release redirect exceeds that behind the proxy, so the
        # download dies with {:header_too_long, {:max, 10240}}. Fetch both with
        # curl into the paths the packages probe and they skip their own
        # download. Keep these versions in step with config/config.exs.
        mkdir -p /workspace/_build

        case "$$(dpkg --print-architecture)" in
          amd64) tw=x64; eb=linux-x64 ;;
          arm64) tw=arm64; eb=linux-arm64 ;;
          *) tw=; eb= ;;
        esac

        if [ -n "$$tw" ] && [ ! -x "/workspace/_build/tailwind-linux-$$tw-4.1.12" ]; then
          curl -fsSL -o "/workspace/_build/tailwind-linux-$$tw-4.1.12" \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.12/tailwindcss-linux-$$tw"
          chmod 0755 "/workspace/_build/tailwind-linux-$$tw-4.1.12"
        fi

        # esbuild publishes its binaries to the npm registry, not as GitHub
        # release assets; the tarball holds package/bin/esbuild.
        if [ -n "$$eb" ] && [ ! -x "/workspace/_build/esbuild-$$eb" ]; then
          curl -fsSL "https://registry.npmjs.org/@esbuild/$$eb/-/$$eb-0.25.4.tgz" | tar -xz -C /tmp
          mv /tmp/package/bin/esbuild "/workspace/_build/esbuild-$$eb"
          rm -rf /tmp/package
          chmod 0755 "/workspace/_build/esbuild-$$eb"
        fi

        cd /workspace

        mix local.hex --force
        mix local.rebar --force
        mix deps.get
        mix compile
        mix assets.deploy
        mix release --overwrite

  psc-elixir:
    image: elixir:1.20.4-otp-29-slim
    restart: unless-stopped
    working_dir: /workspace
    environment: *app-environment
    ports:
      - "4000"
    volumes:
      - psc_elixir_release:/workspace
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail

        # Postgrex starts :ssl, and OTP loads the OS trust store with it. The
        # slim image may ship without a bundle, which fails as
        # {:failed_load_cacerts, :no_cacerts_found} instead of a clear error.
        if [ ! -s /etc/ssl/certs/ca-certificates.crt ]; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates
          update-ca-certificates
        fi

        release_path="$$(find /workspace/_build/prod/rel -mindepth 1 -maxdepth 1 -type d -print -quit)"
        if [ -z "$$release_path" ]; then
          echo "No production Mix release was found" >&2
          exit 1
        fi
        release_name="$${release_path##*/}"
        release_bin="$$release_path/bin/$$release_name"

        # The Docker entrypoint (and the Procfile) run the same setup before
        # serving: migrate, the ADMIN_EMAILS bootstrap and the built-in template
        # seed. It is idempotent, so a restart re-applies the current env.
        "$$release_bin" eval "Psc.Release.setup()"

        exec "$$release_bin" start
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/$${PORT}'"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Setup runs migrations and seeds before the endpoint starts listening.
      start_period: 60s

volumes:
  postgres_data:
  psc_elixir_release:
