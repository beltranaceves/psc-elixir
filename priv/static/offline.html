<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#292f37" />
    <title>Offline · PSC</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #292f37;
        --panel: #1e2329;
        --text: #eef1f6;
        --muted: #a8b0bd;
        --accent: #6d4aff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: 100%;
        max-width: 24rem;
        text-align: center;
      }

      .mark {
        width: 4rem;
        height: 4rem;
        border-radius: 1rem;
        display: grid;
        place-items: center;
        margin: 0 auto 1.25rem;
        background: var(--accent);
        font-size: 2.25rem;
        font-weight: 700;
        color: #fff;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.375rem;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.5;
      }

      a {
        display: inline-block;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        background: var(--panel);
        border: 1px solid rgba(238, 241, 246, 0.18);
        color: var(--text);
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        border-color: rgba(238, 241, 246, 0.35);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">P</div>
      <h1>You're offline</h1>
      <p>
        PSC needs a connection to sync a canvas with everyone working on it.
        Check your network and try again.
      </p>
      <a href="/canvas">Try again</a>
    </main>
  </body>
</html>
